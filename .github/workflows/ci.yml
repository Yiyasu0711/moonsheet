name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moonbit/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: moon fmt --check

      - name: Build
        run: moon check

      - name: Run tests
        run: moon test
